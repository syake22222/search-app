```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4285f4">
  <link rel="manifest" href="manifest.json">
  <title>Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #202124;
    }

    .container {
      width: min(700px, 90%);
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      background: white;
      border: 1px solid #ddd;
      border-radius: 28px;
      padding: 6px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 18px;
      font-size: 18px;
      background: transparent;
    }

    select {
      border: none;
      outline: none;
      background: transparent;
      padding: 0 10px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 24px;
      padding: 0 24px;
      background: #4285f4;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #3367d6;
    }

    .links {
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Search</h1>

    <form class="search-box" id="searchForm">
      <input
        id="query"
        type="search"
        placeholder="検索ワードを入力"
        autocomplete="off"
        autofocus
      >

      <select id="engine" aria-label="検索エンジン">
        <option value="google">Google</option>
        <option value="bing">Bing</option>
        <option value="duckduckgo">DuckDuckGo</option>
      </select>

      <button type="submit">検索</button>
    </form>

    <div class="links">
      Chromebook用シンプル検索アプリ
    </div>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const query = document.getElementById("query");
    const engine = document.getElementById("engine");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = query.value.trim();
      if (!text) return;

      const urls = {
        google:
          "https://www.google.com/search?q=",
        bing:
          "https://www.bing.com/search?q=",
        duckduckgo:
          "https://duckduckgo.com/?q="
      };

      const url = urls[engine.value] + encodeURIComponent(text);

      window.location.href = url;
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
